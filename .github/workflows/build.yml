name: Build Rap Auto Mix (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RapAutoMix-Windows-VST3
          path: build/RapAutoMix_artefacts/Release/VST3/
